[package]
name = "my-harness"
description = "MyHarness desktop app (Tauri 2)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "my_harness_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
my-harness-core = { workspace = true }
tauri = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util", "time"] }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
specta = { workspace = true }
specta-typescript = { workspace = true }
tauri-specta = { workspace = true }

# Matar a árvore de processos no tempo esgotado (infra/process): `kill` do grupo, sem `unsafe`.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["process"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
